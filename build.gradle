plugins {
    id 'application'
    id 'java'
}

group = 'budgetwise'
version = 'V1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'budgetwise.Launcher'
}

tasks.named('jar') {
    from(configurations.runtimeClasspath) {
        into('javafx-libs')
    }
    manifest {
        attributes('Main-Class': 'budgetwise.Launcher')
    }
}

dependencies {
    String javaFxVersion = '25.0.1'
    ['win', 'mac', 'mac-aarch64', 'linux'].each { classifier ->
        implementation("org.openjfx:javafx-base:${javaFxVersion}:${classifier}")
        implementation("org.openjfx:javafx-controls:${javaFxVersion}:${classifier}")
        implementation("org.openjfx:javafx-fxml:${javaFxVersion}:${classifier}")
        implementation("org.openjfx:javafx-graphics:${javaFxVersion}:${classifier}")
    }
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def hostOs = org.gradle.internal.os.OperatingSystem.current()
def hostOsName = hostOs.isMacOsX() ? 'mac' : hostOs.isWindows() ? 'win' : 'linux'
def hostArchitecture = System.getProperty('os.arch').toLowerCase()
def hostIsArm = hostArchitecture.contains('aarch64') || hostArchitecture.contains('arm64')
def hostJavaFxClassifier = hostIsArm ? "${hostOsName}-aarch64" : hostOsName

tasks.named('run') {
    classpath = sourceSets.main.output + configurations.runtimeClasspath.filter { file ->
        !file.name.startsWith('javafx-') || file.name.endsWith("-${hostJavaFxClassifier}.jar")
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
